<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>GCS . Ground Control Station</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%23fff'/%3E%3Cpath d='m12 4 6 15-6-3-6 3z' fill='%23111'/%3E%3C/svg%3E" />
    <!-- Tema yang dipilih dipasang sebelum halaman digambar, supaya tidak berkedip gelap lalu terang. Lihat src/state/theme.js. -->
    <script>
      try {
        if (localStorage.getItem('gcs-theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name=color-scheme]').content = 'light'
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
